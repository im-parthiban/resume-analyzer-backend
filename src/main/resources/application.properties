spring.application.name=resume-analyzer
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}


app.jwt.expiration-ms=86400000

spring.jpa.open-in-view=false

app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=https://api.your-provider.com
app.ai.model=your-model-name
app.ai.timeout-seconds=30